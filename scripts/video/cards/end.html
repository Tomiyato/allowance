<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  main { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 200px; }
  .band { top: 0; }
  .brand { display: flex; align-items: center; gap: 26px; }
  .name { font-size: 76px; padding-top: 0.2em; }
  .tagline { margin: 52px 0 66px; font-family: var(--display); font-size: 100px; font-weight: 700; line-height: 1.08; letter-spacing: -0.015em; color: var(--ink); }
  .tagline em { font-style: normal; color: var(--brand); }
  .links { display: flex; gap: 28px; }
  .link {
    display: flex; align-items: center; gap: 18px;
    padding: 20px 30px 20px 24px; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 2px 4px rgba(60, 38, 20, 0.05), 0 14px 36px rgba(60, 38, 20, 0.10);
    font-size: 38px; font-weight: 650; color: var(--ink); letter-spacing: -0.01em;
  }
  .link .ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-ink); }
  .link small { display: block; font-size: 22px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; text-transform: uppercase; margin-bottom: 2px; }
  .built { margin-top: 64px; display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 600; color: var(--muted); }
  .built i { width: 52px; height: 4px; border-radius: 2px; background: var(--gold); }
</style>
</head>

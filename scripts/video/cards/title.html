<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  main { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 200px; gap: 46px; }
  .brand { display: flex; align-items: center; gap: 40px; }
  .name { font-size: 196px; font-weight: 750; letter-spacing: -0.045em; line-height: 1; color: var(--brand); }
  .tagline { margin: 0; font-size: 76px; font-weight: 650; line-height: 1.12; letter-spacing: -0.025em; }
  .tagline em { font-style: normal; color: var(--accent); }
  .tagline .not { color: var(--muted); }
  .event { display: flex; align-items: center; gap: 18px; font-size: 32px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; margin-top: 10px; }
  .event i { width: 52px; height: 4px; border-radius: 2px; background: var(--mint); }
</style>
</head>
<body class="bg">
  <main>
    <div class="brand">
      <svg class="mark" width="170" height="170" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0e3b43" />
        <path d="M8 21a8 8 0 0 1 16 0" fill="none" stroke="#7dd3c0" stroke-width="3" stroke-linecap="round" />
        <path d="M8 21a8 8 0 0 1 4.3-7.1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
        <circle cx="16" cy="21" r="2" fill="#fff" />
      </svg>
      <span class="name">Allowance</span>
    </div>
    <p class="tagline">Give your AI agent an <em>allowance</em>,<br /><span class="not">not your wallet.</span></p>
    <div class="event"><i></i>PayPal AI Hackathon 2026</div>
  </main>
</body>
</html>

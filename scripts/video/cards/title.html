<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="theme.css" />
<!-- Title card (0:00-0:16): brand, tagline and the two hook facts from the PayPal 2026 Holiday Shopping Survey
     (docs/research/impact-stats.md, verified). -->
<style>
  main { position: relative; height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 200px; }
  .band { top: 0; }
  .brand { display: flex; align-items: center; gap: 44px; }
  .name { font-size: 176px; padding-top: 0.2em; }
  .tagline { margin: 34px 0 0; font-family: var(--display); font-size: 66px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; color: var(--ink); }
  .tagline em { font-style: normal; color: var(--brand); }
  .facts { display: flex; gap: 32px; margin-top: 64px; }
  .fact {
    flex: 1; display: flex; align-items: center; gap: 30px; padding: 26px 34px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 24px;
    box-shadow: 0 2px 4px rgba(60, 38, 20, 0.05), 0 14px 36px rgba(60, 38, 20, 0.10);
  }
  .fact b { flex: none; font-family: var(--display); font-size: 104px; font-weight: 700; line-height: 1; color: var(--brand); letter-spacing: -0.02em; }
  .fact.gold b { color: var(--gold-deep); }
  .fact span { font-size: 33px; font-weight: 600; line-height: 1.25; color: var(--ink-2); }
  .fact span strong { color: var(--ink); }
  .source { margin-top: 20px; font-size: 25px; font-weight: 600; color: var(--muted); }
  .event { display: flex; align-items: center; gap: 18px; font-size: 28px; font-weight: 600; color: var(--muted); letter-spacing: 0.01em; margin-top: 46px; }
  .event i { width: 52px; height: 4px; border-radius: 2px; background: var(--gold); }
</style>
</head>

<!doctype html>
<!-- Devpost cover / thumbnail for Allowance. Render to 00-cover.png (1500×1000) with:
     node scripts/screenshots.mjs --cover
     Colors, pill, meter and card banners follow web/src/styles.css. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Allowance cover</title>
<style>
  :root {
    --bg: #f4f6f7;
    --surface: #ffffff;
    --ink: #13293a;
    --ink-2: #3e5162;
    --muted: #5d6c7a;
    --line: #e2e8ee;
    --brand: #0e3b43;
    --accent: #0f766e;
    --accent-ink: #0b5e58;
    --mint: #7dd3c0;
    --ok: #067647;
    --ok-soft: #ecfdf3;
    --ok-line: #abefc6;
    --block: #b42318;
    --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1500px;
    height: 1000px;
    overflow: hidden;
    font-family: var(--font);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
    background:
      radial-gradient(900px 700px at 100% 0%, rgba(125, 211, 192, 0.32), transparent 60%),
      radial-gradient(700px 600px at 0% 100%, rgba(15, 118, 110, 0.10), transparent 60%),
      var(--bg);
  }
  .stage {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 660px;
    grid-template-rows: auto auto;
    align-content: center;
    column-gap: 56px;
    row-gap: 60px;
    padding: 0 96px;
  }
  .brand { grid-column: 1 / -1; }
  .left { display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }

  /* ---------- left: name + tagline ---------- */
  .brand { display: flex; align-items: center; gap: 30px; }
  .brand svg { flex: none; filter: drop-shadow(0 10px 24px rgba(14, 59, 67, 0.28)); }
  .name {
    font-size: 150px;
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
    color: var(--brand);
  }
  .tagline {
    margin: 0;
    font-size: 60px;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.025em;
    color: var(--ink);
  }
  .tagline em { font-style: normal; color: var(--accent); }
  .tagline .not { color: var(--muted); }
  .built {
    display: flex;
    padding-bottom: 6px;
    align-items: center;
    gap: 14px;
    font-size: 26px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.01em;
  }
  .built i { width: 40px; height: 3px; border-radius: 2px; background: var(--mint); }

  /* ---------- right: the idea in three UI pieces ---------- */
  .stack { display: flex; flex-direction: column; gap: 26px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 26px;
    box-shadow: 0 2px 4px rgba(16, 40, 56, 0.05), 0 18px 48px rgba(16, 40, 56, 0.13);
    overflow: hidden;
  }

  .meter { padding: 30px 34px 34px; }
  .meter-label {
    font-size: 21px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted);
  }
  .meter-top { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .meter-amount strong { font-size: 66px; font-weight: 800; letter-spacing: -0.03em; }
  .meter-of { font-size: 38px; color: var(--muted); font-weight: 600; }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 28px; font-weight: 700;
    padding: 8px 22px 8px 18px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok);
  }
  .pill-dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 7px rgba(6, 118, 71, 0.14); }
  .track { margin-top: 22px; height: 16px; border-radius: 999px; background: #e8edf0; overflow: hidden; }
  .fill { width: 73.3%; height: 100%; border-radius: 999px; background: var(--accent); }

  .banner { display: flex; align-items: center; gap: 22px; padding: 24px 30px; }
  .banner .ic {
    flex: none; width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center;
  }
  .banner .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .banner strong { font-size: 30px; font-weight: 750; letter-spacing: -0.01em; line-height: 1.2; }
  .banner span { font-size: 24px; line-height: 1.3; }

  .ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
  .ok .ic { background: #d1fadf; }
  .ok span { color: #2f6b4f; }

  .block { background: var(--block); border-color: var(--block); color: #fff; }
  .block .ic { background: rgba(255, 255, 255, 0.16); }
  .block span { color: #ffe4e1; }
  .block s { text-decoration-thickness: 2px; }

  .stack { align-self: stretch; }
</style>
</head>
<body>
  <main class="stage">
      <div class="brand">
        <svg width="128" height="128" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0e3b43" />
          <path d="M8 21a8 8 0 0 1 16 0" fill="none" stroke="#7dd3c0" stroke-width="3" stroke-linecap="round" />
          <path d="M8 21a8 8 0 0 1 4.3-7.1" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
          <circle cx="16" cy="21" r="2" fill="#fff" />
        </svg>
        <span class="name">Allowance</span>
      </div>
    <section class="left">
      <p class="tagline">Give your AI agent<br />an <em>allowance</em>,<br /><span class="not">not your wallet.</span></p>
      <div class="built"><i></i>Built with PayPal + AI</div>
    </section>

    <section class="stack" aria-label="How it works">
      <div class="card meter">
        <div class="meter-label">Mandate · left to spend</div>
        <div class="meter-top">
          <span class="meter-amount"><strong>$110</strong><span class="meter-of"> / $150</span></span>
          <span class="pill"><span class="pill-dot"></span>Active</span>
        </div>
        <div class="track"><div class="fill"></div></div>
      </div>

      <div class="card banner ok">
        <span class="ic">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z M9 8h6 M9 12h6 M9 16h3" /></svg>
        </span>
        <div class="txt">
          <strong>Purchased inside your mandate</strong>
          <span>Botanical gift box · garden · <b>$40.00</b></span>
        </div>
      </div>

      <div class="card banner block">
        <span class="ic">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z M9.5 9.5l5 5 M14.5 9.5l-5 5" /></svg>
        </span>
        <div class="txt">
          <strong>Blocked by your mandate</strong>
          <span>Robot vacuum · electronics · <s>$44.90</s></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
